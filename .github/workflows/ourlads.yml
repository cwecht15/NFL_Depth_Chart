name: Scrape OurLads

# Hourly scrape of OurLads team depth charts → docs/data/ourlads.json.
# Besides the depth-chart tables this captures each page's "Updated:" stamp,
# which the editor's OurLads tracker compares against our own "last checked"
# records — so it needs to run more often than the old daily cadence.
# 32 HTTP requests at 1.5s intervals ≈ 50s. The commit step no-ops when
# nothing changed, so Pages only rebuilds when OurLads actually republished.
# Runs at :07 to stay clear of the */10 snapshot job.

on:
  schedule:
    - cron: "7 * * * *"  # hourly at :07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ourlads
  cancel-in-progress: false

jobs:
  ourlads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraping deps
        run: pip install requests beautifulsoup4 tzdata

      - name: Scrape OurLads
        run: python tools/pull_ourlads.py

      - name: Commit if changed
        run: |
          git config user.name "ourlads-bot"
          git config user.email "ourlads-bot@users.noreply.github.com"
          git add docs/data/ourlads.json
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "ourlads: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry up to 5 times in case another bot pushed concurrently.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; rebasing and retrying..."
            sleep $((i * 2))
          done
          echo "All push attempts failed." >&2
          exit 1
