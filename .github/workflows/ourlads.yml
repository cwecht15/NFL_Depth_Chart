name: Scrape OurLads

# Daily scrape of OurLads team depth charts → docs/data/ourlads.json.
# This is slower than the main snapshot (32 HTTP requests at 1.5s intervals
# ≈ 50s) so it gets its own cron.

on:
  schedule:
    - cron: "30 12 * * *"  # 12:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ourlads
  cancel-in-progress: false

jobs:
  ourlads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraping deps
        run: pip install requests beautifulsoup4

      - name: Scrape OurLads
        run: python tools/pull_ourlads.py

      - name: Commit if changed
        run: |
          git config user.name "ourlads-bot"
          git config user.email "ourlads-bot@users.noreply.github.com"
          git add docs/data/ourlads.json
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "ourlads: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry up to 5 times in case another bot pushed concurrently.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; rebasing and retrying..."
            sleep $((i * 2))
          done
          echo "All push attempts failed." >&2
          exit 1
