name: Pull DepthChart Snapshot

# Reads the live Google Sheet via the `fp-data` service account and commits
# the resulting docs/data/snapshot.json so GitHub Pages serves it.
#
# GitHub Pages has a soft limit of ~10 builds/hour. The 10-minute cron leaves
# headroom (6/hour) for the occasional manual dispatch.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: Pull snapshot
        env:
          FP_DATA_KEY_JSON: ${{ secrets.FP_DATA_KEY_JSON }}
        run: python tools/pull_snapshot.py

      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add docs/data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
