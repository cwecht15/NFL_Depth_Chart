name: Pull DepthChart Snapshot

# Reads the live Google Sheet via the `fp-data` service account and uploads
# the resulting snapshot.json to a Cloudflare R2 bucket. The frontend on
# Cloudflare Pages fetches it from R2 directly — no commit needed, so this
# can run as often as you want without piling up commits on the repo.

on:
  schedule:
    # Every 10 minutes. R2 has no per-month write cap on the free tier
    # (1M class-A operations is plenty), so this can be cranked down as
    # low as 5 minutes if needed.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: Pull snapshot and upload to R2
        env:
          FP_DATA_KEY_JSON: ${{ secrets.FP_DATA_KEY_JSON }}
          R2_ACCOUNT_ID:    ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:        ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY:    snapshot.json
        run: python tools/pull_snapshot.py
