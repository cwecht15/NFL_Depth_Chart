name: Pull DepthChart Snapshot

# Runs on a schedule + manual dispatch. Pulls the live Google Sheet via the
# `fp-data` service account (key stored as the FP_DATA_KEY_JSON secret) and
# commits the resulting docs/data/snapshot.json so GitHub Pages serves it.

on:
  schedule:
    # Hourly (top of the hour). Cloudflare Pages free tier is 500 builds/mo;
    # 24/day = ~720/mo, which usually fits under that with Cloudflare's build
    # de-dup. Drop to "0 */2" (every 2h, ~360/mo) for more headroom, or use
    # workflow_dispatch only.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: Pull snapshot
        env:
          FP_DATA_KEY_JSON: ${{ secrets.FP_DATA_KEY_JSON }}
        run: python tools/pull_snapshot.py

      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add docs/data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
